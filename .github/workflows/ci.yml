# Build, test outside the Hardware, UI, Installed and Worker categories (also as x86 for Core, Storage and the service),
# then make the installers and test them on x64 and on Arm64 (spec §13). The Worker category runs the households Worker locally with wrangler, which the lead runs by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --filter "Category!=Hardware&Category!=UI&Category!=Installed&Category!=Worker"

      # The 32-bit build: Core, Storage (SQLite's own x86 library) and the service's tests run in a 32-bit process, built
      # self-contained for win-x86 so the runner needs no x86 .NET of its own. No hosted runner has 32-bit Windows, so the
      # x86 installer is compiled below but installed nowhere.
      - name: Test as x86
        shell: pwsh
        run: |
          foreach ($project in 'Core', 'Storage', 'Service') {
            dotnet test "tests/PowerLedger.$project.Tests" -c Release -r win-x86 --self-contained `
              --filter "Category!=Hardware&Category!=UI&Category!=Installed&Category!=Worker"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: ./installer/get-inno-setup.ps1

      - name: Installer
        shell: pwsh
        run: |
          ./installer/build.ps1 -TestVariants
          ./installer/build.ps1 -SkipPublish -Fast -For x64,arm64,x86

      # The installer and its upgrade build, kept under installer/output so test/ stays a subfolder; the Arm64 job
      # installs them.
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            installer/output/*.exe
            installer/output/test/*.exe

      # Hosted Windows runners are administrators, so the installer test's silent steps run here, on x64.
      - name: Installer test
        shell: pwsh
        run: ./installer/test-installer.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-results
          path: installer/output/test-results/

  # The same installer on Arm64 Windows, which is where its Arm64 build is exercised. GitHub-hosted Windows runners
  # are administrators, so the silent steps run here too.
  installer-arm64:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer/output

      - name: Installer test
        shell: pwsh
        run: ./installer/test-installer.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-results-arm64
          path: installer/output/test-results/

  # The data-sharing Worker: nothing here needs the Windows jobs' build, so it runs on its own.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Test
        working-directory: server
        run: npm test

# Build, test outside the Hardware, UI and Installed categories, then make the installer and test it (spec §13).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --filter "Category!=Hardware&Category!=UI&Category!=Installed"

      - name: Install Inno Setup
        shell: pwsh
        run: ./installer/get-inno-setup.ps1

      - name: Installer
        shell: pwsh
        run: ./installer/build.ps1 -TestVariants

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/output/*.exe

      # Hosted Windows runners are administrators, so the installer test's silent steps run here.
      - name: Installer test
        shell: pwsh
        run: ./installer/test-installer.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-results
          path: installer/output/test-results/

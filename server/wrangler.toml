name = "powerledger-data"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# R2 isn't enabled on the account yet, so bodies are kept in D1 until it is (src/store.ts). Uncomment once R2 is enabled and the "powerledger-data" bucket exists; bodies then go to R2, and any kept in D1 meanwhile stay readable.
# [[r2_buckets]]
# binding = "REPORTS"
# bucket_name = "powerledger-data"

[[d1_databases]]
binding = "DB"
database_name = "powerledger-index"
database_id = "9fb625e2-f540-4491-a9e6-f3ddc0f9348b"
migrations_dir = "migrations"

[[ratelimits]]
name = "ADDRESS_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Starting a pairing-by-code meeting, per address: far more than anyone pairing needs, far fewer than a flood.
[[ratelimits]]
name = "MEETING_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["17 3 * * *"]

# Sign-in (households design §7): the public client IDs of the owner's Azure app registration and Google OAuth client, filled in when they exist. Empty turns that provider's sign-in off.
[vars]
MS_CLIENT_ID = ""
GOOGLE_CLIENT_ID = "422411367198-3470upgqo0tubjqdpo4fuhhl00ce9qb9.apps.googleusercontent.com"

# In-app feedback (src/feedback.ts): the owner's PRIVATE repo, "owner/name", that feedback is filed in as issues, with its
# images committed. The token for it is a secret (tools/set-feedback-token.ps1). Either empty turns feedback off (503).
FEEDBACK_REPO = "mharisjamal/PowerLedger-feedback"

# The oldest app version whose reports and history are taken (src/version.ts, Plan Q spec §3): older ones get 426 and
# update themselves. GET /v1/app-policy gives it to the service. 0.0.0 takes every version; 0.9.0 once 0.9.0 is out.
MIN_APP_VERSION = "0.9.0"

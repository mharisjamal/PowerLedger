name = "powerledger-data"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# R2 isn't enabled on the account yet, so bodies are kept in D1 until it is (src/store.ts). Uncomment once R2 is enabled and the "powerledger-data" bucket exists; bodies then go to R2, and any kept in D1 meanwhile stay readable.
# [[r2_buckets]]
# binding = "REPORTS"
# bucket_name = "powerledger-data"

[[d1_databases]]
binding = "DB"
database_name = "powerledger-index"
database_id = "9fb625e2-f540-4491-a9e6-f3ddc0f9348b"
migrations_dir = "migrations"

[[ratelimits]]
name = "ADDRESS_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["17 3 * * *"]
